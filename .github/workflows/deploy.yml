name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ zhilvde/patch-63513 ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# 👇 这里是关键！必须加环境！
environment:
  name: github-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Slidev
        run: pnpm run build -- --base=/my-ppt/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: slidev-build
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: slidev-build
