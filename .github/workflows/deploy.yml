name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ zhilvde/patch-63513 ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Slidev
        run: npm run build -- --base=/my-ppt/

      # 只上传一次，并且自定义 artifact 名字，避免冲突
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          name: slidev-build
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: slidev-build
